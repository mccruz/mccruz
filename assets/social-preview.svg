<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Mark Cruz AI automation and implementation portfolio</title>
  <desc id="description">A dark recruiter portfolio card highlighting reliable workflows, human review, verified outcomes, Python, SQL, API integrations, and reliability.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07162A"/>
      <stop offset="55%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#103A4A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4BE1B7"/>
      <stop offset="100%" stop-color="#65B8FF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#020A14" flood-opacity="0.36"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1135" cy="85" r="210" fill="#2F8FB3" opacity="0.09"/>
  <circle cx="1165" cy="600" r="260" fill="#42D3A3" opacity="0.06"/>
  <path d="M72 80 H276" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="128" fill="#78E4C6" font-size="22" font-weight="700" letter-spacing="4">AI AUTOMATION &amp; IMPLEMENTATION</text>
    <text x="72" y="216" fill="#FFFFFF" font-size="72" font-weight="700">Mark Cruz</text>
    <text x="72" y="267" fill="#C9DAEA" font-size="29">Reliable workflows · Human review · Verified outcomes</text>

    <g filter="url(#shadow)">
      <rect x="72" y="326" width="344" height="154" rx="18" fill="#102E4F" stroke="#2B5879"/>
      <rect x="468" y="326" width="344" height="154" rx="18" fill="#102E4F" stroke="#2B5879"/>
      <rect x="864" y="326" width="344" height="154" rx="18" fill="#102E4F" stroke="#2B5879"/>
    </g>

    <circle cx="112" cy="369" r="10" fill="#4BE1B7"/>
    <text x="138" y="377" fill="#78E4C6" font-size="19" font-weight="700" letter-spacing="2">AUTOMATE</text>
    <text x="112" y="429" fill="#FFFFFF" font-size="26" font-weight="700">APIs + structured data</text>

    <circle cx="508" cy="369" r="10" fill="#65B8FF"/>
    <text x="534" y="377" fill="#8CCBFF" font-size="19" font-weight="700" letter-spacing="2">CONTROL</text>
    <text x="508" y="429" fill="#FFFFFF" font-size="26" font-weight="700">Human-in-the-loop</text>

    <circle cx="904" cy="369" r="10" fill="#F3C969"/>
    <text x="930" y="377" fill="#F3D990" font-size="19" font-weight="700" letter-spacing="2">VERIFY</text>
    <text x="904" y="429" fill="#FFFFFF" font-size="26" font-weight="700">Tests + receipts</text>

    <text x="72" y="563" fill="#AFC3D5" font-size="21" font-weight="700" letter-spacing="3">PYTHON  •  SQL  •  API INTEGRATIONS  •  RELIABILITY</text>
  </g>
</svg>
